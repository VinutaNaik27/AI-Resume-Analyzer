<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body { background: #f9f9f9; font-family: Poppins; }
    .navbar { background: navy; }
    .container { margin-top: 50px; }
    .card { margin-bottom: 20px; padding: 20px; }
    .result-box { background: white; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="container d-flex justify-content-between">
    <a class="navbar-brand text-white" href="/">Resume Analyzer AI</a>
    <a href="/" class="btn btn-light btn-sm">Home</a>
  </div>
</nav>
<div class="container">
  <h3 class="text-center mb-4">Analysis History</h3>
  {% for item in data %}
  <div class="card">
    <div class="d-flex justify-content-between">
      <h5>Analysis #{{ item.id }}</h5>
      <form method="POST" action="/delete/{{ item.id }}"
            onsubmit="return confirm('Delete this record?');">
        <button class="btn btn-danger btn-sm">Delete</button>
      </form>
    </div>
    <hr>
    <h6>Job Description:</h6>
    <p>{{ item.job_description }}</p>
    <h6>Result:</h6>
    <div class="result-box" id="result-{{ item.id }}"></div>
  </div>
  <script>
    const md{{ item.id }} = {{ item.result | tojson | safe }};
    document.getElementById("result-{{ item.id }}").innerHTML = marked.parse(md{{ item.id }});
  </script>
  {% endfor %}
</div>
</body>
</html>
